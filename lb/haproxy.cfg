# Level 5 load balancer. Every setting that a test changes comes from an
# environment variable in docker-compose.yml (LB_BALANCE, LB_SERVER_MAXCONN,
# LB_QUEUE_TIMEOUT), so you never edit this file between steps.

global
    maxconn 20000
    # HAProxy counts the Mac's cores, not the container's CPU quota. Without this
    # it starts too many threads for a 1 CPU limit and gets throttled.
    nbthread 2

# Docker's built-in DNS. Re-resolved every few seconds, so a restarted instance
# (new IP) is found again. Instances that don't exist yet start as DOWN.
resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold nx 1s
    hold other 2s
    hold obsolete 2s

defaults
    mode http
    # Reuse connections to the instances (a new connection per request would
    # recreate the Level 3 step 0 problem, one layer up).
    option http-keep-alive
    option dontlognull
    timeout connect 1s
    timeout client 15s
    timeout server 15s
    timeout http-keep-alive 60s
    timeout queue "${LB_QUEUE_TIMEOUT}"
    # Retry only when the connection itself failed (request never sent), so a
    # POST /orders is never sent twice. Try another instance for that retry.
    retries 2
    retry-on conn-failure
    option redispatch

frontend public
    bind :8080
    # Tells you which instance answered (curl -i).
    http-response set-header X-Served-By %[srv_name]
    default_backend apps

backend apps
    balance "${LB_BALANCE}"
    # Active health check: every 1 s; 2 failures = DOWN, 2 successes = UP again.
    # Level 6: LB_HEALTH_PATH=/readyz makes a draining instance (readiness 503) leave rotation.
    option httpchk GET "${LB_HEALTH_PATH}"
    http-check expect status 200
    default-server check inter 1s fall 2 rise 2 resolvers docker init-addr none maxconn "${LB_SERVER_MAXCONN}"
    server app1 app1:8080
    server app2 app2:8080
    server app3 app3:8080

# Stats page: http://localhost:8404/stats (CSV: http://localhost:8404/stats;csv)
listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 1s
