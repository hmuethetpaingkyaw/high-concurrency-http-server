# Resource limits emulate EC2 sizes. Override per level, e.g.:
#   APP_CPUS=0.5 APP_MEM=512m docker compose up -d --build
# Level 5: three identical app instances (app1-3) behind HAProxy (lb).
# The Level 3 switches now default to the FIXED settings (pool, timeout, join,
# cache, singleflight). Set DB_POOL=off, CACHE=off, ... to reproduce the naive steps.
x-app: &app
  build: .
  image: hcs-app:latest
  environment:
    CPU_ROUNDS: "${CPU_ROUNDS:-5000}"
    # In-flight caps per endpoint (0 disables shedding). Defaults live in main.go.
    MAX_INFLIGHT_FAST: "${MAX_INFLIGHT_FAST:-}"
    MAX_INFLIGHT_IO: "${MAX_INFLIGHT_IO:-}"
    MAX_INFLIGHT_CPU: "${MAX_INFLIGHT_CPU:-}"
    MAX_INFLIGHT_DB: "${MAX_INFLIGHT_DB:-}"
    DATABASE_URL: "postgres://app:app@postgres:5432/shop?sslmode=disable"
    REDIS_ADDR: "redis:6379"
    DB_POOL: "${DB_POOL:-on}"            # level 3 step 1
    DB_MAX_CONNS: "${DB_MAX_CONNS:-10}"  # per instance: 3 instances = 30 of Postgres's 100
    DB_MIN_CONNS: "${DB_MIN_CONNS:-0}"
    DB_TIMEOUT: "${DB_TIMEOUT:-300ms}"   # level 3 step 2
    LIST_QUERY: "${LIST_QUERY:-join}"    # level 3 step 3
    CACHE: "${CACHE:-on}"                # level 3 step 4
    CACHE_TTL: "${CACHE_TTL:-30s}"
    SINGLEFLIGHT: "${SINGLEFLIGHT:-on}"  # level 3 step 5
    # Level 7: honor the Idempotency-Key header on POST /orders (off = ignored).
    IDEMPOTENCY: "${IDEMPOTENCY:-off}"
    # Level 6: graceful shutdown. Off by default (naive: SIGTERM kills instantly).
    GRACEFUL_SHUTDOWN: "${GRACEFUL_SHUTDOWN:-off}"
    DRAIN_DELAY: "${DRAIN_DELAY:-5s}"            # readiness fails, then wait this long before closing
    SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-15s}"  # max time to let in-flight requests finish
    POOL_CLOSE_TIMEOUT: "${POOL_CLOSE_TIMEOUT:-3s}" # max time to wait for the DB pool to close
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  # Docker sends SIGTERM, then SIGKILL after this. Must be longer than
  # DRAIN_DELAY + SHUTDOWN_TIMEOUT (5 s + 15 s by default). The default is 10 s.
  stop_grace_period: "${STOP_GRACE_PERIOD:-30s}"
  deploy:
    resources:
      limits:
        cpus: "${APP_CPUS:-0.5}"   # each instance is the Level 3 box
        memory: "${APP_MEM:-512m}"

services:
  # Only the load balancer is public. Instances are reached through it; their
  # pprof/expvar ports are published on this Mac only (6061-6063).
  lb:
    image: haproxy:3.0-alpine
    ports:
      - "${LB_PORT:-8080}:8080" # all traffic enters here (LB_PORT if 8080 is taken on your Mac)
      - "127.0.0.1:8404:8404" # HAProxy stats page
    environment:
      LB_BALANCE: "${LB_BALANCE:-roundrobin}"             # step 3: leastconn
      LB_SERVER_MAXCONN: "${LB_SERVER_MAXCONN:-0}"        # step 4: max requests in flight per instance (0 = unlimited)
      LB_QUEUE_TIMEOUT: "${LB_QUEUE_TIMEOUT:-1s}"         # step 4: how long a request may wait for a free slot
      LB_HEALTH_PATH: "${LB_HEALTH_PATH:-/healthz}"      # level 6 step 2: /readyz = stop sending to draining instances
    volumes:
      - ./lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    deploy:
      resources:
        limits:
          cpus: "${LB_CPUS:-1}"
          memory: 256m

  app1:
    <<: *app
    ports:
      - "127.0.0.1:6061:6060"
  app2:
    <<: *app
    ports:
      - "127.0.0.1:6062:6060"
  app3:
    <<: *app
    ports:
      - "127.0.0.1:6063:6060"

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: TCP only opens after the init scripts have finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d shop"]
      interval: 2s
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1" # ~ db.t4g.small; max_connections stays at the default 100
          memory: 1g

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          cpus: "0.5" # ~ cache.t4g.micro
          memory: 256m

  k6:
    image: grafana/k6:1.0.0
    profiles: ["load"] # only started via `docker compose run k6 ...`
    environment:
      TARGET: "http://lb:8080"   # load goes through the load balancer
      K6_NO_USAGE_REPORT: "true" # also works around a compose panic on `run -e` with no environment block
    volumes:
      - ./loadtest:/scripts:ro
    deploy:
      resources:
        limits:
          cpus: "3" # own budget so the load generator never steals the app's CPU
          memory: 3g # spike tests need thousands of virtual users

  slowloris:
    image: hcs-app:latest # same image as the app; built by `make up`
    profiles: ["attack"] # only started via `docker compose run slowloris ...`
    entrypoint: ["/slowloris"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  pgdata:
